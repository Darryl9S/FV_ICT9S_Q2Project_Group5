<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
background-color: #e6e0cc;
font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}
.contact-container {
max-width: 750px;
margin: 60px auto;
padding: 35px;
background-color: white;
border-radius: 20px;
box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}
h1 {
color: #00708c;
text-align: center;
font-weight: bold;
}
.form-label {
color: #000000;
font-weight: bold;
}
.form-control {
border-radius: 10px;
padding: 12px;
}
.btn-contact {
background-color: #ead4bb;
color: white;
border: none;
padding: 12px 25px;
border-radius: 10px;
}
</style>
</head>
<body>
<div class="container contact-container">
<h1>Contact Us </h1>
<p class="text-center text-muted">
Any questions or inquiries? Contact us now!
</p>
<form>
<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" class="form-control" placeholder="Enter your name">
</div>
<div class="mb-3">
<label class="form-label">Email Address</label>
<input type="email" class="form-control" placeholder="Enter your email">
</div>
<div class="mb-3">
<label class="form-label">Subject</label>
<input type="text" class="form-control" placeholder="Enter your subject">
</div>
<div class="mb-3">
<label class="form-label">Your Message</label>
<textarea class="form-control" rows="5"
placeholder="Write your message here..."></textarea>
</div>
<div class="text-center">
<button type="submit" class="btn btn-contact">Send Message
</button></div></form></div></body></html>
