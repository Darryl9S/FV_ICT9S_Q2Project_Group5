<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-image: url("https://www.bing.com/th/id/OIP.H49KtWXuYaXvBNVj7VAR4QHaEI?w=193&h=135&c=8&rs=1&qlt=90&o=6&dpr=1.1&pid=ImgAns&rm=2");
            background-size: cover;
            background-repeat: no-repeat;
        }

        #Enroll {
            width: 80%;
            background-color: white;
            border-radius: 5px;
            margin: auto;
            margin-top: 30px;
            padding: 20px;
            display: block;
        }
        #form {
            width: 100%;
        }
    </style>
</head>
<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><img src="https://files.orangeapps.ph/disk001/School_Files/1/school-65/school_profile/1789004299-2727.png" alt="OB_Logo" class="img-fluid" style="height: 75px; width: 75px;"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
            <span class="navbar-toggler-icon"></span>
            </button>
        <div class="collapse navbar-collapse" id="mynavbar">
            <ul class="navbar-nav me-auto">
            <li class="nav-item">
            <a class="nav-link" href="#">Home</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#">Courses Offer</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#">Enroll Now</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#">Contact Us</a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="#">About the Group Member</a>
            </li>
        </ul>
        <form class="d-flex">
        <a href="https://obmontessori.orangeapps.ph/landing/obmontessori/" class="btn btn-primary">My Portal</a>
        </form>
        </div>
    </nav>
<body>
    <form id="Enroll">

        <div id="form">

            <h1 class="text-center">Enrollment Form</h1>

            <h2>Student Information</h2>

            <div class="row">
                <div class="col">
                    <label class="form-label">First Name:</label>
                    <input type="text" class="form-control mb-3"
                    placeholder="Enter your first name">
                </div>

                <div class="col">
                    <label class="form-label">Last Name:</label>
                    <input type="text" class="form-control mb-3"
                    placeholder="Enter your last name">
                </div>
            </div>

            <div class="row">

                <div class="col">
                    <label class="form-label">Birth Date:</label>
                    <input type="date" class="form-control mb-3">
                </div>

                <div class="col">
                    <label class="form-label">Gender:</label>
                    <select class="form-select mb-3" id="Gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="col">
                    <label class="form-label">Child's Grade:</label>
                    <select class="form-select mb-3" id="Grade">
                        <option value="Grade 1">Grade 1</option>
                        <option value="Grade 2">Grade 2</option>
                        <option value="Grade 3">Grade 3</option>
                        <option value="Grade 4">Grade 4</option>
                        <option value="Grade 5">Grade 5</option>
                        <option value="Grade 6">Grade 6</option>
                        <option value="Grade 7">Grade 7</option>
                        <option value="Grade 8">Grade 8</option>
                        <option value="Grade 9">Grade 9</option>
                        <option value="Grade 10">Grade 10</option>
                        <option value="Grade 11">Grade 11</option>
                        <option value="Grade 12">Grade 12</option>
                    </select>
                </div>

            </div>

            <h2>Contact Information</h2>

            <div class="row">

                <div class="col">
                    <label class="form-label">Email:</label>
                    <input type="email" class="form-control mb-3"
                    placeholder="email@example.com">
                </div>

                <div class="col">
                    <label class="form-label">Phone Number:</label>
                    <input type="tel" class="form-control mb-3"
                    placeholder="123-456-789">
                </div>

            </div>

            <button type="submit" class="btn btn-primary w-25 d-block mx-auto mb-3">
                Submit Enrollment
            </button>

        </div>

    </form>

</body>
</html>
